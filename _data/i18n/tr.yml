      place: Paris, Fransa
    - school: İstanbul Teknik Üniversitesi
      degree: Lisans, Elektronik ve Haberleşme Mühendisliği · 3,56/4,00
      period: 2020 – 2025
      place: İstanbul, Türkiye
      degree2: "Lisans, Uçak Mühendisliği (Çift anadal) · 3,37/4,00"
  experience:
    - title: Lisansüstü Araştırma Stajyeri
      org: Paris Elektrik ve Elektronik Mühendisliği Laboratuvarı (GeePs)
      period: Şub 2026 – Tem 2026
      place: Paris, Fransa
      bullets:
        - Prof. Guido Valerio danışmanlığında, 29,7–31,5 GHz Ka bandında çalışan tamamen metal, oluklu bir Bull's Eye sızıntılı dalga antenini CST Studio Suite ve ANSYS HFSS ile tasarladım ve karakterize ettim.
        - Dalga kılavuzu besleme geçişi için MATLAB'da yarı analitik, tam dalga destekli bir empedans uyumlama yöntemi geliştirdim; kapasitif irisleri kaba kuvvet parametre taramalarına ihtiyaç duymadan tasarladım.
        - Yakın alan açıklık verisini ışıma örüntülerine bağlayan bir Python açıklık-uzak alan araç seti geliştirdim; sonuçlar tüm bant boyunca CST tam dalga sonuçlarıyla yakın uyum gösterdi.
        - Frekansa bağlı hüzme yönlendirme için sızıntılı modun karmaşık yayılma sabitini bir dispersiyon çıkarma prosedürüyle elde ettim; halka maskeleme ve yarık bazlı katkı analizleriyle açıklık kalitesini sınırlayan azimutal rezonansları belirleyip yay segmentasyonu temelli çözümler önerdim.
        - ESoA/GENIUS doktora kursu "Anten Uygulamaları için Yapay Malzemelerde Simetrilerin Kullanımı"na katıldım.
    - title: Lisans Araştırma Asistanı
      org: İTÜ Tıbbi Cihazlar Araştırma ve Uygulama Laboratuvarı
      period: Eyl 2024 – Tem 2025
      place: İstanbul, Türkiye
      bullets:
        - Kafa içi kanamanın mikrodalga görüntülemeyle sürekli izlenmesine yönelik sanal prototipin tasarımına liderlik ettim; kırınım sınırlarını aşmak ve çözünürlüğü artırmak için makine öğrenmesi çözümleri kullandım.
        - ANSYS HFSS, CST ve Altair Feko ile sayısal doğrulama yaptım; görüntü netliğini iyileştiren Python tabanlı bir sinir ağı modeli geliştirdim.
    - title: Lisans Araştırma Asistanı
      org: İTÜ Havacılık Araştırma Merkezi (ITU-ARC)
      period: Eyl 2024 – Haz 2025
      place: İstanbul, Türkiye
      bullets:
        - 2,4 GHz faz dizili anteni HFSS'te tasarlayıp simüle ettim, ürettim ve hüzme yönlendirme kabiliyetini test ettim.
        - Faz kaydırıcı eleman olarak pasif bir interdijital kapasitörü (IDC) MATLAB'da tasarlayıp iteratif olarak optimize ettim.
        - Simüle edilen (33,5°) ve ölçülen (30°) hüzme açılarını karşılaştırarak üretilen IDC ile pasif hüzme yönlendirmeyi doğruladım.
    - title: Makine Öğrenmesi Mühendisliği Stajyeri
      org: Baykar Teknoloji
      period: Ağu 2023 – Eyl 2023
      place: İstanbul, Türkiye
      bullets:
        - Üretim hattının verimliliğini artırmak için Python, OpenCV ve TensorFlow ile nesne tespiti, tanıma ve kalite kontrol algoritmaları geliştirdim.
    - title: Test Mühendisliği Stajyeri
      org: Aselsan
      period: Haz 2023 – Tem 2023
      place: Ankara, Türkiye
      bullets:
        - LoRa E32 modülleri ve Arduino Uno ile uzun menzilli haberleşme düzeneği kurdum; UART hızı, parite ve güç gibi LoRa E32 parametrelerini ayarlayan bir C# arayüzü geliştirdim.
    - title: Lisans Araştırma Asistanı
      org: Bountenna Antenler ve Yayılım Araştırma Laboratuvarı
      period: Kas 2022 – Haz 2023
      place: İstanbul, Türkiye
      bullets:
        - Doç. Dr. Sema Dumanlı danışmanlığında IoHT uygulamaları için biyobozunur sensör ve fantom tasarımına katkı sağladım.
        - HFSS'te bir yarık anteni üzerinde parametrik çalışma yaparak yarık uzunluğu, taban yüksekliği ve besleme kaymasının rezonans frekansı ve bant genişliğine etkisini inceledim.
        - VNA ve yankısız oda gibi RF ölçüm ekipmanlarıyla uygulamalı deneyim kazandım.
        - IEEE AP/MTT/EMC/ED Türkiye Ortak Şubesi üyesi olarak akademik konuşmalar ve teknik ağ kurma etkinlikleri düzenledim.
    - title: Yazılım Mühendisliği Stajyeri
      org: Türk Havacılık ve Uzay Sanayii (TUSAŞ)
      period: Kas 2022 – May 2023
      place: İstanbul, Türkiye
      bullets:
        - C ve C++ ile havacılık yazılımları geliştirip test ettim; aviyonik ve sistem bileşenleri, simülasyonlar ve hata ayıklama konularında mühendislerle çalıştım.
        - SKY Experience Staj Programı kapsamında Makine Öğrenmesi, Sistem Mühendisliği, Temel Uçuşa Elverişlilik ve Mühendislik Temelleri sertifikalarını tamamladım.
