home:
  title: Ana Sayfa
  hello: Burak Erdil Biçer
  role: "Roma Sapienza Üniversitesi'nde doktora öğrencisi"
  dept: "<a href=\"https://diet.web.uniroma1.it/\" target=\"_blank\" rel=\"noopener\">Bilgi Mühendisliği, Elektronik ve Telekomünikasyon Bölümü (DIET)</a>"
  interests_h: "Araştırma alanları:"
  interests: "antenler, metamalzemeler, uygulamalı elektromanyetik, makine öğrenmesi"
  intro:
    - "Antenler, uygulamalı elektromanyetik ve kablosuz sistemler üzerine çalışan bir elektronik ve haberleşme mühendisiyim. Kasım 2026'dan itibaren <a href=\"https://www.uniroma1.it\" target=\"_blank\" rel=\"noopener\">Roma Sapienza Üniversitesi</a>'nde Bilgi ve İletişim Teknolojileri (ICT) alanında doktora öğrencisiyim."
    - "<a href=\"https://www.sorbonne-universite.fr\" target=\"_blank\" rel=\"noopener\">Sorbonne Üniversitesi</a>'nden (Paris) Haberleşen Sistemler alanında yüksek lisans derecem, <a href=\"https://www.itu.edu.tr\" target=\"_blank\" rel=\"noopener\">İstanbul Teknik Üniversitesi</a>'nden ise Elektronik ve Haberleşme Mühendisliği ile Uçak Mühendisliği alanlarında iki lisans derecem var."
    - "Yüksek lisans araştırmamı GeePs'te (Paris) Ka bandında çalışan bir Bull's Eye sızıntılı dalga anteninin tasarımı ve empedans uyumlaması üzerine yaptım. Daha önce beyin izleme için mikrodalga görüntüleme, faz dizili antenler, biyobozunur sensörler ve bilgisayarlı görü ile biyosinyal işlemede makine öğrenmesi uygulamaları üzerine çalıştım."
  beyond: "Laboratuvar dışında Türkiye'nin en büyük öğrenci medyası <a href=\"https://ari24.com\" target=\"_blank\" rel=\"noopener\">arı24</a>'ün Genel Yayın Yönetmenliğini yaptım; uzun yıllar <a href=\"https://www.worldcubeassociation.org/persons/2017BICE01\" target=\"_blank\" rel=\"noopener\">World Cube Association</a> yarışmacısı ve organizatörü oldum, birçok Türkiye rekoru kırdım. Seyahat etmeyi, fotoğraf çekmeyi ve kayak yapmayı seviyorum; lisede yüzme Türkiye Şampiyonası'nda yarıştım."
  news_h: "Haberler"
  news:
    - date: "2026-11"
      text: "Roma Sapienza Üniversitesi'nde Bilgi ve İletişim Teknolojileri doktorama başladım; Prof. Davide Comite ve Prof. Guido Valerio ile çalışıyorum."
    - date: "2026-07"
      text: "GeePs'te Ka bandında çalışan Bull's Eye sızıntılı dalga anteni üzerine yüksek lisans tezimi tamamladım."
    - date: "2026-02"
      text: "Paris'te GeePs'e araştırma stajyeri olarak katıldım ve Prof. Guido Valerio ile çalışmaya başladım."
    - date: "2025-09"
      text: "Sorbonne Üniversitesi'nde ESoA'nın \"Exploiting Symmetries in Artificial Materials for Antenna Applications\" kursunu tamamladım."
    - date: "2025-06"
      text: "İTÜ'de iki bitirme projemi sundum: mikrodalga ile beyin görüntüleme ve interdijital kapasitörlü faz dizili anten."

