      period: 2020 – 2025
      place: Istanbul, Turchia
      degree2: "Laurea in Ingegneria Aeronautica (doppio titolo) · 3,37/4,00"
  experience:
    - title: Tirocinante di ricerca (laurea magistrale)
      org: Laboratorio di Ingegneria Elettrica ed Elettronica di Parigi (GeePs)
      period: Feb 2026 – Lug 2026
      place: Parigi, Francia
      bullets:
        - Progettazione e caratterizzazione di un'antenna a onda leaky Bull's Eye corrugata interamente metallica operante nella banda Ka 29,7–31,5 GHz con CST Studio Suite e ANSYS HFSS, sotto la supervisione del Prof. Guido Valerio.
        - Implementazione in MATLAB di una tecnica di adattamento d'impedenza semi-analitica assistita da simulazioni full-wave per la transizione di alimentazione in guida d'onda, progettando iris capacitivi senza ricorrere a sweep parametrici a forza bruta.
        - Sviluppo di un toolkit Python apertura-campo lontano che collega i dati di campo vicino sull'apertura ai diagrammi di radiazione, in stretto accordo con i risultati full-wave di CST su tutta la banda.
        - Estrazione della costante di propagazione complessa del modo leaky tramite una procedura di estrazione della dispersione per il beam steering dipendente dalla frequenza; identificazione delle principali limitazioni di qualità dell'apertura (risonanze azimutali) con analisi ring-masking e per singolo slot, proponendo strategie di mitigazione a segmentazione in archi.
        - Partecipazione al corso dottorale ESoA/GENIUS "Exploiting Symmetries in Artificial Materials for Antenna Applications".
    - title: Assistente di ricerca (laurea triennale)
      org: Laboratorio di Ricerca e Applicazione sui Dispositivi Medici dell'ITU
      period: Set 2024 – Lug 2025
      place: Istanbul, Turchia
      bullets:
        - Guida della progettazione di un prototipo virtuale per il monitoraggio continuo dell'emorragia intracranica tramite imaging a microonde, con soluzioni di machine learning per superare il limite di diffrazione e migliorare la risoluzione.
        - Verifica numerica in ANSYS HFSS, CST e Altair Feko e sviluppo di una rete neurale in Python per migliorare la nitidezza delle immagini.
    - title: Assistente di ricerca (laurea triennale)
      org: Centro di Ricerca Aerospaziale dell'ITU (ITU-ARC)
      period: Set 2024 – Giu 2025
      place: Istanbul, Turchia
      bullets:
        - Progettazione, simulazione, realizzazione e test di un'antenna a schiera a scansione di fase a 2,4 GHz in HFSS per validarne la capacità di beam steering.
        - Progettazione e ottimizzazione iterativa in MATLAB di un condensatore interdigitato passivo (IDC) come elemento sfasatore.
        - Validazione del sistema confrontando lo steering simulato (33,5°) e misurato (30°), a conferma del beam steering passivo con l'IDC realizzato.
    - title: Tirocinante Machine Learning Engineer
      org: Baykar Technologies
      period: Ago 2023 – Set 2023
      place: Istanbul, Turchia
      bullets:
        - Sviluppo in Python, con OpenCV e TensorFlow, di algoritmi di rilevamento e riconoscimento di oggetti e di controllo qualità per migliorare l'efficienza della linea di produzione.
    - title: Tirocinante Test Engineer
      org: Aselsan
      period: Giu 2023 – Lug 2023
      place: Ankara, Turchia
      bullets:
        - Realizzazione di un collegamento a lungo raggio con moduli LoRa E32 e Arduino Uno e di un'interfaccia C# per configurare i parametri LoRa E32 (baud rate UART, parità, potenza).
    - title: Assistente di ricerca (laurea triennale)
      org: Laboratorio Bountenna Antenne e Propagazione
      period: Nov 2022 – Giu 2023
      place: Istanbul, Turchia
      bullets:
        - Contributo alla progettazione di sensori biodegradabili e fantocci per applicazioni IoHT, sotto la supervisione della Prof.ssa Sema Dumanlı.
        - Studio parametrico di un'antenna a slot in HFSS, analizzando l'effetto di lunghezza dello slot, spessore del substrato e offset dell'alimentazione su frequenza di risonanza e larghezza di banda.
        - Esperienza pratica con strumentazione di misura RF come VNA e camera anecoica.
        - Organizzazione di seminari accademici ed eventi di networking tecnico come membro dell'IEEE AP/MTT/EMC/ED Turkey Joint Chapter.
    - title: Tirocinante Software Engineer
      org: Turkish Aerospace
      period: Nov 2022 – Mag 2023
      place: Istanbul, Turchia
      bullets:
        - Sviluppo e test di software aerospaziale in C e C++, collaborando con ingegneri su componenti avionici e di sistema, simulazioni e debugging.
        - Certificazioni del programma SKY Experience in Machine Learning, Ingegneria dei Sistemi, Aeronavigabilità di base e Fondamenti di Ingegneria.
