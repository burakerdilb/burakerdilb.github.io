    - school: Sorbonne Université – Faculté des Sciences et Ingénierie
      degree: Laurea magistrale in Sistemi Comunicanti · 16,48/20 · Mention Très Bien
      period: 2025 – 2026
      place: Parigi, Francia
    - school: Università Tecnica di Istanbul
