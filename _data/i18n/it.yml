home:
  title: Home
  hello: Burak Erdil Biçer
  role: "Dottorando presso Sapienza Università di Roma"
  dept: "<a href=\"https://diet.web.uniroma1.it/\" target=\"_blank\" rel=\"noopener\">Dipartimento di Ingegneria dell'Informazione, Elettronica e Telecomunicazioni (DIET)</a>"
  interests_h: "Interessi di ricerca:"
  interests: "antenne, metamateriali, elettromagnetismo applicato, machine learning"
  intro:
    - "Sono un ingegnere elettronico e delle telecomunicazioni e mi occupo di antenne, elettromagnetismo applicato e sistemi wireless. Da novembre 2026 sono dottorando in Tecnologie dell'Informazione e della Comunicazione (ICT) presso la <a href=\"https://www.uniroma1.it\" target=\"_blank\" rel=\"noopener\">Sapienza Università di Roma</a>."
    - "Ho conseguito una laurea magistrale in Sistemi Comunicanti presso la <a href=\"https://www.sorbonne-universite.fr\" target=\"_blank\" rel=\"noopener\">Sorbonne Université</a> (Parigi) e due lauree presso l'<a href=\"https://www.itu.edu.tr\" target=\"_blank\" rel=\"noopener\">Università Tecnica di Istanbul</a>, in Ingegneria Elettronica e delle Telecomunicazioni e in Ingegneria Aeronautica."
    - "La mia ricerca di laurea magistrale al GeePs (Parigi) si è concentrata sulla progettazione e l'adattamento di un'antenna a onda leaky di tipo Bull's Eye in banda Ka. In precedenza ho lavorato su imaging a microonde per il monitoraggio del cervello, antenne a schiera a scansione di fase, sensori biodegradabili e applicazioni del machine learning nella visione artificiale e nell'elaborazione di biosegnali."
  beyond: "Fuori dal laboratorio sono stato direttore responsabile di <a href=\"https://ari24.com\" target=\"_blank\" rel=\"noopener\">arı24</a>, il più grande media studentesco della Turchia, e per anni concorrente e organizzatore della <a href=\"https://www.worldcubeassociation.org/persons/2017BICE01\" target=\"_blank\" rel=\"noopener\">World Cube Association</a>, con diversi record nazionali turchi. Amo viaggiare, fotografare e sciare, e al liceo ho gareggiato ai campionati nazionali turchi di nuoto."
  news_h: "Novità"
  news:
    - date: "2026-11"
      text: "Ho iniziato il dottorato in Information and Communications Technologies alla Sapienza Università di Roma, con il Prof. Davide Comite e il Prof. Guido Valerio."
    - date: "2026-07"
      text: "Ho concluso la tesi magistrale al GeePs su un'antenna leaky-wave Bull's Eye in banda Ka."
    - date: "2026-02"
      text: "Sono entrato al GeePs di Parigi come tirocinante di ricerca, con il Prof. Guido Valerio."
    - date: "2025-09"
      text: "Ho completato il corso ESoA \"Exploiting Symmetries in Artificial Materials for Antenna Applications\" alla Sorbonne Université."
    - date: "2025-06"
      text: "Ho presentato i miei due progetti di laurea all'ITU: imaging a microonde del cervello e un phased array con condensatore interdigitato."

