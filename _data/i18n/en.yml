      place: Istanbul, Turkey
      degree2: "B.Sc. Aeronautical Engineering (Double major) · 3.37/4.00"
  experience:
    - title: Graduate Research Intern
      org: Laboratory of Electrical and Electronic Engineering of Paris (GeePs)
      period: Feb 2026 – Jul 2026
      place: Paris, France
      bullets:
        - Designed and characterized an all-metal corrugated Bull's Eye leaky-wave antenna operating across the 29.7–31.5 GHz Ka-band in CST Studio Suite and ANSYS HFSS, under the supervision of Prof. Guido Valerio.
        - Implemented a semi-analytical, full-wave-assisted impedance-matching technique in MATLAB for the waveguide feed transition, designing capacitive irises without brute-force parameter sweeps.
        - Developed a Python aperture-to-far-field toolkit linking near-field aperture data to radiated patterns, in close agreement with CST full-wave results across the band.
        - Retrieved the complex propagation constant of the leaky mode through a dispersion-extraction procedure to enable frequency-dependent beam steering, and identified aperture-quality limitations (azimuthal resonances) through ring-masking and per-slot analyses, proposing arc-segmentation mitigation strategies.
        - Attended the ESoA/GENIUS doctoral course "Exploiting Symmetries in Artificial Materials for Antenna Applications".
    - title: Undergraduate Research Assistant
      org: ITU Medical Devices Research & Application Lab
      period: Sep 2024 – Jul 2025
      place: Istanbul, Turkey
      bullets:
        - Led the design of a virtual prototype for continuous monitoring of intracranial hemorrhage using microwave imaging, with machine-learning solutions to overcome diffraction limits and enhance resolution.
        - Performed numerical verification in ANSYS HFSS, CST and Altair Feko, and developed a Python neural-network model to improve image clarity.
    - title: Undergraduate Research Assistant
      org: ITU Aerospace Research Center (ITU-ARC)
      period: Sep 2024 – Jun 2025
      place: Istanbul, Turkey
      bullets:
        - Designed, simulated, fabricated and tested a 2.4 GHz phased-array antenna in HFSS to validate its beam-steering capability.
        - Designed and iteratively optimized a passive interdigital capacitor (IDC) as the phase-shifting element in MATLAB.
        - Validated the system by comparing the simulated (33.5°) and measured (30°) beam steer, confirming passive beam steering with the fabricated IDC.
    - title: Machine Learning Engineering Intern
      org: Baykar Technologies
      period: Aug 2023 – Sep 2023
      place: Istanbul, Turkey
      bullets:
        - Developed object detection, recognition and quality-control algorithms in Python with OpenCV and TensorFlow to improve production-line efficiency.
    - title: Test Engineering Intern
      org: Aselsan
      period: Jun 2023 – Jul 2023
      place: Ankara, Turkey
      bullets:
        - Built a long-range communication setup with LoRa E32 modules and Arduino Uno, and a C# interface to configure LoRa E32 parameters such as UART rate, parity and power.
    - title: Undergraduate Research Assistant
      org: Bountenna Antennas & Propagation Research Lab
      period: Nov 2022 – Jun 2023
      place: Istanbul, Turkey
      bullets:
        - Contributed to biodegradable sensor and phantom design for IoHT applications under the supervision of Assoc. Prof. Sema Dumanlı.
        - Conducted a parametric study of a slot antenna in HFSS, investigating how slot length, substrate height and feed offset affect resonant frequency and bandwidth.
        - Gained hands-on experience with RF measurement equipment such as VNAs and an anechoic chamber.
        - Arranged academic talks and technical networking events as a member of the IEEE AP/MTT/EMC/ED Turkey Joint Chapter.
    - title: Software Engineering Intern
      org: Turkish Aerospace
      period: Nov 2022 – May 2023
      place: Istanbul, Turkey
      bullets:
        - Developed and tested aerospace software in C and C++, collaborating with engineers on avionics and systems components, simulations and debugging.
        - Completed the SKY Experience Internship Program certifications in Machine Learning, Systems Engineering, Basic Airworthiness and Engineering Fundamentals.
