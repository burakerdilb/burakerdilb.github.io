home:
  title: Home
  hello: Burak Erdil Biçer
  role: "Ph.D. student at Sapienza University of Rome"
  dept: "<a href=\"https://diet.web.uniroma1.it/\" target=\"_blank\" rel=\"noopener\">Department of Information Engineering, Electronics and Telecommunications (DIET)</a>"
  interests_h: "Research interests:"
  interests: "antennas, metamaterials, applied electromagnetics, machine learning"
  intro:
    - "I am an electronics and communications engineer working on antennas, applied electromagnetics and wireless systems. From November 2026 I am a Ph.D. student in Information and Communications Technologies at <a href=\"https://www.uniroma1.it\" target=\"_blank\" rel=\"noopener\">Sapienza University of Rome</a>."
    - "I hold an M.Sc. in Communicating Systems from <a href=\"https://www.sorbonne-universite.fr\" target=\"_blank\" rel=\"noopener\">Sorbonne Université</a> (Paris) and two B.Sc. degrees from <a href=\"https://www.itu.edu.tr\" target=\"_blank\" rel=\"noopener\">Istanbul Technical University</a>, in Electronics and Communications Engineering and in Aeronautical Engineering."
    - "My master's research at GeePs (Paris) focused on the design and matching of a Ka-band Bull's Eye leaky-wave antenna. Earlier, I worked on microwave imaging for brain monitoring, phased-array antennas, biodegradable sensors, and machine-learning applications in computer vision and biosignal processing."
  beyond: "Outside the lab I have been Editor in Chief of <a href=\"https://ari24.com\" target=\"_blank\" rel=\"noopener\">arı24</a>, Turkey's largest student media initiative, and a long-time <a href=\"https://www.worldcubeassociation.org/persons/2017BICE01\" target=\"_blank\" rel=\"noopener\">World Cube Association</a> competitor and organizer, with several Turkish national records. I enjoy travelling, photography and skiing, and I swam competitively at the Turkish National Championship in high school."
  news_h: "News"
  news:
    - date: "2026-11"
      text: "Started my Ph.D. in Information and Communications Technologies at Sapienza University of Rome, working with Prof. Davide Comite and Prof. Guido Valerio."
    - date: "2026-07"
      text: "Completed my master's thesis at GeePs on a Ka-band Bull's Eye leaky-wave antenna."
    - date: "2026-02"
      text: "Joined GeePs in Paris as a graduate research intern, working with Prof. Guido Valerio."
    - date: "2025-09"
      text: "Completed the ESoA course \"Exploiting Symmetries in Artificial Materials for Antenna Applications\" at Sorbonne Université."
    - date: "2025-06"
      text: "Presented my two graduation projects at ITU: microwave brain imaging and a phased array with an interdigital capacitor."

