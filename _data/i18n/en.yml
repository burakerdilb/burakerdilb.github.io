      place: Rome, Italy
    - school: Sorbonne Université – Faculté des Sciences et Ingénierie
      degree: M.Sc. Communicating Systems · 16.48/20 · Mention Très Bien
      period: 2025 – 2026
      place: Paris, France
    - school: Istanbul Technical University
      degree: B.Sc. Electronics and Communications Engineering · 3.56/4.00
