  education:
    - school: Université Sapienza de Rome
      degree: Doctorat en Technologies de l'information et de la communication (ICT)
      period: Nov. 2026 – Oct. 2029
      place: Rome, Italie
    - school: Sorbonne Université – Faculté des Sciences et Ingénierie
      degree: Master Systèmes communicants · 16,48/20 · mention Très Bien
      period: 2025 – 2026
      place: Paris, France
    - school: Université technique d'Istanbul
      degree: Licence d'ingénieur en électronique et télécommunications · 3,56/4,00
      period: 2020 – 2025
      place: Istanbul, Turquie
      degree2: "Licence d'ingénieur en aéronautique (double diplôme) · 3,37/4,00"
  experience:
    - title: Stagiaire de recherche (master)
      org: Laboratoire de Génie Électrique et Électronique de Paris (GeePs)
      period: Fév. 2026 – Juil. 2026
      place: Paris, France
      bullets:
        - Conception et caractérisation d'une antenne à ondes de fuite Bull's Eye corruguée entièrement métallique fonctionnant dans la bande Ka 29,7–31,5 GHz, sous CST Studio Suite et ANSYS HFSS, sous la direction du Prof. Guido Valerio.
        - Mise en œuvre sous MATLAB d'une technique d'adaptation d'impédance semi-analytique assistée par simulation full-wave pour la transition d'alimentation en guide d'onde, avec conception d'iris capacitifs sans balayage paramétrique exhaustif.
        - Développement d'un outil Python ouverture-vers-champ lointain reliant les données de champ proche aux diagrammes de rayonnement, en bon accord avec les résultats full-wave CST sur toute la bande.
        - Extraction de la constante de propagation complexe du mode de fuite par une procédure d'extraction de dispersion pour un dépointage de faisceau dépendant de la fréquence ; identification des limitations de qualité d'ouverture (résonances azimutales) par masquage annulaire et analyse par fente, avec proposition de stratégies de segmentation en arcs.
        - Participation au cours doctoral ESoA/GENIUS « Exploiting Symmetries in Artificial Materials for Antenna Applications ».
    - title: Assistant de recherche (licence)
      org: Laboratoire de recherche et d'application sur les dispositifs médicaux de l'ITU
      period: Sept. 2024 – Juil. 2025
      place: Istanbul, Turquie
      bullets:
        - Direction de la conception d'un prototype virtuel pour la surveillance continue des hémorragies intracrâniennes par imagerie micro-ondes, avec des solutions d'apprentissage automatique pour dépasser la limite de diffraction et améliorer la résolution.
        - Vérification numérique sous ANSYS HFSS, CST et Altair Feko, et développement d'un réseau de neurones en Python pour améliorer la netteté des images.
    - title: Assistant de recherche (licence)
      org: Centre de recherche aérospatiale de l'ITU (ITU-ARC)
      period: Sept. 2024 – Juin 2025
      place: Istanbul, Turquie
      bullets:
        - Conception, simulation, fabrication et test d'un réseau d'antennes à commande de phase à 2,4 GHz sous HFSS pour valider sa capacité de dépointage.
        - Conception et optimisation itérative sous MATLAB d'un condensateur interdigité passif (IDC) comme élément déphaseur.
        - Validation du système par comparaison du dépointage simulé (33,5°) et mesuré (30°), confirmant le dépointage passif avec l'IDC fabriqué.
    - title: Stagiaire ingénieur en apprentissage automatique
      org: Baykar Technologies
      period: Août 2023 – Sept. 2023
      place: Istanbul, Turquie
      bullets:
        - Développement en Python, avec OpenCV et TensorFlow, d'algorithmes de détection, de reconnaissance d'objets et de contrôle qualité pour améliorer l'efficacité de la ligne de production.
    - title: Stagiaire ingénieur test
      org: Aselsan
      period: Juin 2023 – Juil. 2023
      place: Ankara, Turquie
      bullets:
        - Mise en place d'une liaison longue portée avec des modules LoRa E32 et un Arduino Uno, et développement d'une interface C# pour configurer les paramètres LoRa E32 (débit UART, parité, puissance).
    - title: Assistant de recherche (licence)
      org: Laboratoire Bountenna Antennes et Propagation
      period: Nov. 2022 – Juin 2023
      place: Istanbul, Turquie
      bullets:
        - Contribution à la conception de capteurs biodégradables et de fantômes pour des applications IoHT, sous la direction de la Prof. Sema Dumanlı.
        - Étude paramétrique d'une antenne à fente sous HFSS, analysant l'influence de la longueur de fente, de l'épaisseur du substrat et du décalage d'alimentation sur la fréquence de résonance et la bande passante.
        - Expérience pratique des équipements de mesure RF tels que les VNA et la chambre anéchoïque.
        - Organisation de conférences académiques et d'événements de réseautage technique en tant que membre du IEEE AP/MTT/EMC/ED Turkey Joint Chapter.
    - title: Stagiaire ingénieur logiciel
      org: Turkish Aerospace
      period: Nov. 2022 – Mai 2023
      place: Istanbul, Turquie
      bullets:
        - Développement et test de logiciels aérospatiaux en C et C++, en collaboration avec des ingénieurs sur des composants avioniques et systèmes, des simulations et du débogage.
        - Certifications du programme SKY Experience en apprentissage automatique, ingénierie système, navigabilité de base et fondamentaux de l'ingénierie.
