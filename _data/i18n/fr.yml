home:
  title: Accueil
  hello: Burak Erdil Biçer
  role: "Doctorant à Sapienza Université de Rome"
  dept: "<a href=\"https://diet.web.uniroma1.it/\" target=\"_blank\" rel=\"noopener\">Département d'ingénierie de l'information, d'électronique et de télécommunications (DIET)</a>"
  interests_h: "Thèmes de recherche :"
  interests: "antennes, métamatériaux, électromagnétisme appliqué, apprentissage automatique"
  intro:
    - "Je suis ingénieur en électronique et télécommunications, spécialisé dans les antennes, l'électromagnétisme appliqué et les systèmes sans fil. À partir de novembre 2026, je suis doctorant en Technologies de l'information et de la communication (ICT) à l'<a href=\"https://www.uniroma1.it\" target=\"_blank\" rel=\"noopener\">Université Sapienza de Rome</a>."
    - "Je suis titulaire d'un master Systèmes communicants de <a href=\"https://www.sorbonne-universite.fr\" target=\"_blank\" rel=\"noopener\">Sorbonne Université</a> (Paris) et de deux licences d'ingénieur de l'<a href=\"https://www.itu.edu.tr\" target=\"_blank\" rel=\"noopener\">Université technique d'Istanbul</a>, en électronique et télécommunications et en ingénierie aéronautique."
    - "Mes travaux de master au GeePs (Paris) ont porté sur la conception et l'adaptation d'une antenne à ondes de fuite de type Bull's Eye en bande Ka. Auparavant, j'ai travaillé sur l'imagerie micro-ondes pour la surveillance du cerveau, les réseaux d'antennes à commande de phase, les capteurs biodégradables et les applications de l'apprentissage automatique en vision par ordinateur et en traitement des biosignaux."
  beyond: "En dehors du laboratoire, j'ai été rédacteur en chef d'<a href=\"https://ari24.com\" target=\"_blank\" rel=\"noopener\">arı24</a>, le plus grand média étudiant de Turquie, et de longue date compétiteur et organisateur à la <a href=\"https://www.worldcubeassociation.org/persons/2017BICE01\" target=\"_blank\" rel=\"noopener\">World Cube Association</a>, avec plusieurs records nationaux turcs. J'aime voyager, photographier et skier, et j'ai participé au championnat national turc de natation au lycée."
  news_h: "Actualités"
  news:
    - date: "2026-11"
      text: "J'ai commencé mon doctorat en Technologies de l'information et de la communication à l'Université Sapienza de Rome, avec le Prof. Davide Comite et le Prof. Guido Valerio."
    - date: "2026-07"
      text: "J'ai terminé mon mémoire de master au GeePs sur une antenne à ondes de fuite Bull's Eye en bande Ka."
    - date: "2026-02"
      text: "J'ai rejoint le GeePs à Paris comme stagiaire de recherche, auprès du Prof. Guido Valerio."
    - date: "2025-09"
      text: "J'ai terminé le cours ESoA « Exploiting Symmetries in Artificial Materials for Antenna Applications » à Sorbonne Université."
    - date: "2025-06"
      text: "J'ai présenté mes deux projets de fin d'études à l'ITU : l'imagerie micro-ondes du cerveau et un réseau phasé à capacité interdigitée."

