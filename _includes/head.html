<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
{%- seo title=false -%}
{%- assign page_title = page.title -%}
<title>{% if page_title %}{{ page_title }} · {% endif %}{{ site.title }}</title>
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>
  // Apply saved theme/language before first paint to avoid a flash.
  (function () {
    var root = document.documentElement;
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', t);
    } catch (e) {}
    try {
      var supported = {{ site.languages | map: "code" | jsonify }};
      var q = new URLSearchParams(location.search).get('lang');
      var l = q || localStorage.getItem('lang');
      if (supported.indexOf(l) === -1) {
        l = (navigator.language || 'en').slice(0, 2).toLowerCase();
        if (supported.indexOf(l) === -1) l = 'en';
      }
      root.setAttribute('lang', l);
      if (l !== 'en') root.setAttribute('data-i18n-pending', '');
    } catch (e) {}
  })();
</script>
<script>
  window.SITE = {
    baseurl: "{{ site.baseurl }}",
    version: "{{ site.time | date: '%s' }}",
    name: {{ site.title | jsonify }},
    pageTitleKey: {{ page.i18n_title | default: '' | jsonify }}
  };
</script>
