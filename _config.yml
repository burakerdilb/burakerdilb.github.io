# Site settings
title: "Burak Erdil Biçer"
description: "Personal website of Burak Erdil Biçer — Ph.D. student in ICT at Sapienza University of Rome, working on antennas, electromagnetics and wireless systems."
url: "https://burakerdilb.github.io"
baseurl: ""
repository: "burakerdilb/burakerdilb.github.io"
lang: en
timezone: Europe/Rome

author:
  name: "Burak Erdil Biçer"
  email: "burakerdil.bicer@uniroma1.it"
  avatar: "/images/profile.png"
  location: "Rome, Italy"
  linkedin: "https://www.linkedin.com/in/burakerdilb"
  github: "https://github.com/burakerdilb"
  scholar: "https://scholar.google.com/citations?user=YCorXZIAAAAJ"
  figshare: "https://figshare.com/authors/Burak_Erdil_Bi_er/20504651"

# Languages the UI can be switched to (first one is the default / fallback).
languages:
  - code: en
    label: English
    short: EN
  - code: tr
    label: Türkçe
    short: TR
  - code: fr
    label: Français
    short: FR
  - code: it
    label: Italiano
    short: IT

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
    values:
      layout: page

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
